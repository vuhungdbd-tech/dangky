<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#175b48"><meta name="description" content="Đăng ký học sinh ở lại cuối tuần tại Phân hiệu Suối Lư, Trường PTDTBT THCS Xa Dung."><title>Suối Lư · Đăng ký học sinh cuối tuần</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:'Segoe UI',Arial,sans-serif;background:#f5f7f4}iframe{display:block;width:100%;height:100dvh;border:0}.loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;padding:25px;background:#f5f7f4;color:#234c3a;z-index:2}.symbol{font-size:28px;width:65px;height:65px;display:grid;place-items:center;background:#175b48;color:#fff;border-radius:18px;margin:0 auto 18px}h1{font-size:21px;margin:0 0 10px}p{font-size:13px;line-height:1.8;color:#718371;margin:0}.loading a{display:inline-block;background:#237b5c;padding:11px 20px;color:white;border-radius:8px;text-decoration:none;margin-top:20px;font-size:13px}#fallback{display:none}.open-separate{position:fixed;bottom:10px;right:12px;background:#fff;color:#5d7866;border:1px solid #dbe5d9;border-radius:7px;padding:6px 10px;text-decoration:none;font-size:10px;opacity:.9;box-shadow:0 2px 8px #123e2310}@media(max-width:600px){.open-separate{bottom:5px;right:7px;font-size:9px}}</style></head><body><div class="loading" id="loading" role="status"><div class="symbol" aria-hidden="true">⌂</div><h1>Đăng ký học sinh cuối tuần</h1><p>Phân hiệu Suối Lư · Trường PTDTBT THCS Xa Dung<br>Đang mở ứng dụng, thầy cô vui lòng chờ.</p><div id="fallback"><p>Nếu ứng dụng chưa hiển thị, thầy cô có thể mở trực tiếp.</p><a class="direct-link" target="_blank" rel="noopener">Mở ứng dụng</a></div></div><iframe id="appFrame" title="Đăng ký và điểm danh học sinh cuối tuần" allow="clipboard-write; fullscreen"></iframe><a class="direct-link open-separate" target="_blank" rel="noopener" aria-label="Mở ứng dụng trong tab riêng"></a><script>const APP_URL='https://script.google.com/a/~/macros/s/AKfycbw1aQa4Ntr0mBgZa8mtBoAnYaeyy9X8YlkUNVduF0RXmow2gYK8C1pCI4Sp0I4mcx6P/exec';document.querySelectorAll('.direct-link').forEach(a=>a.href=APP_URL);const frame=document.getElementById('appFrame');frame.addEventListener('load',()=>document.getElementById('loading').style.display='none');frame.src=APP_URL;setTimeout(()=>document.getElementById('fallback').style.display='block',12000);</script></body></html>
