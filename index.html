
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Đăng ký học sinh ở lại cuối tuần</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #f8fafc;
    }

    .app-container {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    #appFrame {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 100%;
      border: 0;
      background: white;
    }

    .loading {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
      background: #f8fafc;
      color: #334155;
      text-align: center;
      padding: 20px;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 4px solid #dbeafe;
      border-top-color: #059669;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading p {
      font-size: 14px;
      line-height: 1.6;
    }

    .open-link {
      display: none;
      color: #047857;
      font-weight: bold;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      #appFrame {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="app-container">

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <strong> ỨNG DỤNG ĐIỂM DANH HỌC SINH Ở LẠI CUỐI TUẦN</strong>
      <p>Đang kết nối ứng dụng đăng ký học sinh.<br>
     ỨNG dụng được phát triển bởi: Vũ Hùng - SĐT: 0984246993</p>

      <a class="open-link"
         id="openLink"
         href="#"
         target="_blank"
         rel="noopener">
        Mở ứng dụng trong cửa sổ mới
      </a>
    </div>

    <iframe
      id="appFrame"
      title="Đăng ký học sinh ở lại cuối tuần"
      src="https://script.google.com/a/~/macros/s/AKfycbzqj9uLF4TjNHMoEuEHGYaTefzqjDwbtikNAU19ltHlbG88zdBLPSZzyQ_AuEodW8jY/exec"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>

  </div>

  <script>
    const frame = document.getElementById("appFrame");
    const loading = document.getElementById("loading");
    const openLink = document.getElementById("openLink");

    frame.addEventListener("load", function() {
      loading.style.display = "none";
    });

    // Hỗ trợ mở ứng dụng trực tiếp nếu trình duyệt
    // hoặc thiết lập tài khoản không cho hiển thị iframe.
    openLink.href = frame.src;
  </script>
</body>
</html>
